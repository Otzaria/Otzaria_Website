name: Web performance QA

on:
  pull_request:
    paths:
      - '.github/workflows/web-performance-qa.yml'
      - 'scripts/benchmark-web-performance.mjs'
      - 'scripts/check-perf-budget.mjs'
      - 'scripts/precompress-static.mjs'
      - 'src/app/**'
      - 'src/components/**'
      - 'src/lib/**'
      - 'src/models/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slow-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/otzaria_web_perf
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: '5000'
      NEXTAUTH_SECRET: local-performance-fixture-only
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/web-performance-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/web-performance-browser/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          echo "OTZARIA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/web-performance-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PLUGIN_STORAGE_DIR=$RUNNER_TEMP/web-performance-plugin-storage" >> "$GITHUB_ENV"
      - name: Test the changed loading and download paths
        run: |
          node node_modules/vitest/vitest.mjs run \
            src/components/home/GoldenBook src/components/home/goldenBookPlan \
            src/components/plugins/PluginImage src/app/plugins/all \
            'src/app/api/book/[id]/editor' 'src/app/api/plugins/[id]/download' \
            'src/app/api/plugins/[id]/image' src/app/api/page-content
      - name: Seed the catalog and build the production app
        shell: bash
        run: |
          mkdir -p build/web-performance
          node scripts/benchmark-web-performance.mjs --seed
          npm run build 2>&1 | tee build/web-performance/build.log
      - name: Verify creation of static Brotli companions
        run: |
          node scripts/precompress-static.mjs prepare .next/static/chunks "$RUNNER_TEMP/web-performance-brotli"
          cp "$RUNNER_TEMP/web-performance-brotli/manifest.json" build/web-performance/brotli.json
      - name: Measure cold mobile loads against the local app
        run: |
          node node_modules/next/dist/bin/next start -H 127.0.0.1 > build/web-performance/server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:3000/version.json
          node scripts/benchmark-web-performance.mjs
      - name: Save measurements and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web-performance/
          retention-days: 14
