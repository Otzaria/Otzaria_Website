name: Deploy to VPS with Caching

on:
  push:
    branches:
      - master

jobs:
  # שלב 1: בדיקה ב-GitHub (מהיר יותר בזכות Cache)
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Try to Build
        run: npm run build

  # שלב 2: פריסה לשרת (אופטימיזציה בהעתקת קבצים)
  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 5m
          command_timeout: 30m
          script: |
            # 1. פונקציית "דופק" שתרוץ ברקע ותדפיס נקודה כל 20 שניות
            # זה שומר על החיבור ה-SSH חי כי עובר מידע ב-Stream
            ( while true; do echo "--- SSH Keep-alive Heartbeat ---"; sleep 20; done ) &
            HEARTBEAT_PID=$!

            # פונקציה לניקוי ה-PID בסיום (גם אם יש שגיאה)
            trap "kill $HEARTBEAT_PID" EXIT
            
            set -e

            APP_DIR="/var/www/otzaria-web"
            TEMP_DIR="/var/www/otzaria-web-temp"

            echo "🚀 Starting Optimized Deployment..."


            rm -rf $TEMP_DIR
            mkdir -p $TEMP_DIR

            echo "📋 Copying files (skipping heavy node_modules)..."
            rsync -a --exclude 'node_modules' --exclude '.git' $APP_DIR/ $TEMP_DIR/
            
            cd $TEMP_DIR

            echo "📥 Pulling latest code..."
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
            git fetch --depth 1 origin master
            git reset --hard origin/master

            echo "📦 Installing dependencies..."
            npm ci --legacy-peer-deps

            echo "🛠 Building project..."
            npm run build

            echo "✅ Build successful. Swapping folders..."
            
            rsync -a --delete $TEMP_DIR/ $APP_DIR/

            rm -rf $TEMP_DIR

            echo "🔄 Reloading PM2..."
            cd $APP_DIR
            pm2 reload otzaria-web || pm2 restart otzaria-web

            echo "🎉 Deployment Finished Successfully!"