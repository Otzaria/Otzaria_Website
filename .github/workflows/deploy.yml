name: Deploy to VPS with Caching

on:
  push:
    branches:
      - master
  # הבנייה כאן מתקינה את ראש תגית v1 של הוולידטור, ולכן היא מה שמביא כלל
  # ולידציה חדש לפרודקשן. בלי הסריקה המחזורית הוא היה ממתין לדחיפה
  # הבאה ל-master, שעשויה לא להגיע ימים. ה-cron בודק ולא פורס: הפריסה
  # רצה רק כשהתגית זזה בפועל.
  schedule:
    - cron: '*/5 * * * *'
  # שחרור בוולידטור דוחף לכאן מיד אחרי הזזת v1, במקום להמתין ל-cron —
  # GitHub מחניק את ה-*/5 בפועל לשעות. השער מפעיל פריסה לכל אירוע שאינו
  # schedule, ולכן לא נדרשת כאן לוגיקה נוספת.
  repository_dispatch:
    types: [validator-release]
  workflow_dispatch:

permissions:
  contents: read

# ה-cron וה-push יכולים להיפגש, ושתי פריסות במקביל רצות git reset --hard
# ו-npm install על אותה תיקייה. cancel-in-progress: false — פריסה שנקטעה באמצע
# משאירה את השרת במצב ביניים.
concurrency:
  group: deploy-otzaria-web
  cancel-in-progress: false

jobs:
  # שלב 0: האם יש מה לפרוס. push והפעלה ידנית רצים תמיד; ב-cron משווים
  # את ה-SHA של תגית v1 לזה שכבר נפרס, וזהות = אין מה לעשות.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.v1.outputs.sha }}
    steps:
      # ללא checkout וללא אימות — המאגר ציבורי. v1^{} מועדף כדי שגם תגית
      # annotated תיפתר ל-commit ולא לאובייקט התגית.
      - name: Resolve the validator's v1 tag
        id: v1
        run: |
          set -euo pipefail
          url=https://github.com/Otzaria/otzaria-plugin-validator
          refs="$(git ls-remote "$url" refs/tags/v1 'refs/tags/v1^{}')"
          sha="$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/v1^{}" { print $1 }')"
          if [ -z "$sha" ]; then
            sha="$(printf '%s\n' "$refs" | awk '$2 == "refs/tags/v1" { print $1 }')"
          fi
          if [ -z "$sha" ]; then
            echo "לא נמצאה תגית v1 במאגר הוולידטור" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # ה-cache משמש כסמן בלבד: קיום המפתח פירושו שה-SHA הזה כבר נפרס,
      # ולכן lookup-only. פינוי רשומה ישנה גורר פריסה מיותרת אחת, לא נזק.
      - name: Was this validator already deployed?
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .validator-deployed
          key: validator-v1-${{ steps.v1.outputs.sha }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::הוולידטור (${{ steps.v1.outputs.sha }}) כבר פרוס."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::תגית v1 זזה ל-${{ steps.v1.outputs.sha }} — פורסים."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # שלב 1: בדיקה ב-GitHub (מהיר יותר בזכות Cache)
  build-check:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Prerender exercises real data loaders against an isolated empty database.
    # Production still builds against its own database in the staging checkout.
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/otzaria_ci
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: '5000'
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 with Cache
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # ‏npm ci נאמן ל-SHA שב-package-lock, ולכן תגית נעה לבדה אינה מספיקה:
      # בלי השורה הזאת כלל ולידציה חדש בוולידטור לא היה מגיע לחנות עד לרענון
      # ה-lock. כאן הוא מגיע בכל בנייה. חייב להישאר זהה בשני מקומות ההתקנה,
      # אחרת הפרודקשן פותר גרסה שה-CI לא בדק.
      - name: Install the resolved plugin validator commit
        run: npm install "github:Otzaria/otzaria-plugin-validator#${{ needs.gate.outputs.sha }}" --legacy-peer-deps --no-save

      - name: Verify plugin upload safety
        run: |
          node scripts/patch-plugin-validator.cjs
          npm run test:plugin-safety

      - name: Verify deployment regressions
        run: npm run test:deployment-regressions

      - name: Try to Build
        run: npm run build

  # שלב 2: פריסה לשרת (אופטימיזציה בהעתקת קבצים)
  deploy:
    needs: [gate, build-check]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          timeout: 5m
          command_timeout: 30m
          script: |
            set -eu
            cd /var/www/otzaria-web
            git fetch --depth 1 origin "${{ github.sha }}"
            # Execute the incoming script without replacing live code/dependencies.
            deploy_script="$(git show "${{ github.sha }}:scripts/deploy-web.sh")"
            printf '%s\n' "$deploy_script" | bash -s -- "${{ github.sha }}" "${{ needs.gate.outputs.sha }}"

      # Record only after successful activation, in this job to avoid another
      # runner queue. Immutable cache keys cannot be overwritten.
      - name: Check the deployed validator marker
        id: marker
        uses: actions/cache/restore@v6.1.0
        with:
          path: .validator-deployed
          key: validator-v1-${{ needs.gate.outputs.sha }}
          lookup-only: true

      - name: Record the deployed validator
        if: steps.marker.outputs.cache-hit != 'true'
        run: echo "${{ needs.gate.outputs.sha }}" > .validator-deployed

      - uses: actions/cache/save@v6.1.0
        if: steps.marker.outputs.cache-hit != 'true'
        with:
          path: .validator-deployed
          key: validator-v1-${{ needs.gate.outputs.sha }}
